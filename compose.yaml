services:
  postgres:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger-test
      POSTGRES_DB: ledger
    ports:
      - "127.0.0.1:55439:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - ledger_postgres:/var/lib/postgresql
volumes:
  ledger_postgres:
