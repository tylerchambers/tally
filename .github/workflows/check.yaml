name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.3-alpine@sha256:54451ecb8ab38c24c3ec123f2fd501303a3a1856a5c66e98cecf2460d5e1e9d7
        env:
          POSTGRES_USER: ledger
          POSTGRES_PASSWORD: ledger-test
          POSTGRES_DB: ledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd 'pg_isready -U ledger -d ledger'
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://ledger:ledger-test@localhost:5432/ledger
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test:integration
      - run: bun run build
      - run: node scripts/package-smoke.mjs
